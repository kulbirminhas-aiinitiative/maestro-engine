[pytest]
# Maestro Engine Test Configuration
# Generated: 2025-10-01

# Python files to collect
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Ignore paths (outdated/incomplete tests)
norecursedirs =
    tests/pending
    .git
    .pytest_cache
    __pycache__

# NOTE: Individual test file exclusion is done via --ignore flags in pyproject.toml
# or by moving them to tests/pending directory

# Asyncio mode
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: marks tests as benchmarks
    phase5: marks tests as phase 5 tests
    autonomous: marks tests as autonomous tests
    stigmergy: marks tests as stigmergy tests

# Output
addopts =
    -v
    --tb=short
    --ignore=tests/pending
    --ignore=tests/contract/test_openapi_compliance.py
    --ignore=tests/e2e/test_api_health.py
    --ignore=tests/integration/test_configuration_system.py
    --ignore=tests/regression/test_configuration_regression.py
    --ignore=tests/test_template_registry_service.py
    --ignore=tests/unit/test_dynamic_boundary_manager.py
    --ignore=tests/unit/test_phase_complexity_analyzer.py
    --ignore=tests/unit/test_template_registry_enhanced.py
    --ignore=tests/unit/test_digital_blackboard_system.py

# Coverage (if enabled)
# addopts = -v --tb=short --cov=src --cov-report=html --cov-report=term
