name: Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy pyyaml

      - name: Check code formatting with Black
        run: |
          black --check --line-length=100 src/
        continue-on-error: false

      - name: Check import sorting with isort
        run: |
          isort --check --profile=black --line-length=100 src/
        continue-on-error: false

      - name: Lint with flake8
        run: |
          flake8 src/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=_legacy,_experiments
        continue-on-error: false

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports || true
        continue-on-error: true  # Non-blocking for now

      - name: Check for TODOs in production code
        run: |
          echo "Checking for TODO/FIXME in production code..."
          if grep -rn "TODO\|FIXME" src/ --include="*.py"; then
            echo "❌ Found TODO/FIXME in production code"
            echo "Please remove TODO/FIXME comments before merging"
            exit 1
          else
            echo "✅ No TODO/FIXME found in production code"
          fi

      - name: Check for legacy imports
        run: |
          echo "Checking for imports from _legacy or _experiments..."
          python scripts/check_legacy_imports.py
        continue-on-error: false

      - name: Check for hardcoded URLs
        run: |
          echo "Checking for hardcoded service URLs..."
          python scripts/detect_hardcoded_urls.py --strict
        continue-on-error: true  # Warning only for now (10 files need fixing)

      - name: Validate port allocation
        run: |
          echo "Validating service port allocation..."
          python scripts/validate_port_allocation.py
        continue-on-error: false

      - name: Validate API Gateway configuration
        run: |
          echo "Validating API Gateway (ADR-003)..."

          # Check gateway files exist
          required_files=(
            "src/gateway/__init__.py"
            "src/gateway/main.py"
            "src/gateway/middleware/__init__.py"
            "src/gateway/middleware/auth.py"
            "src/gateway/middleware/cache.py"
            "src/gateway/middleware/circuit_breaker.py"
            "src/gateway/middleware/logging.py"
            "src/gateway/middleware/rate_limit.py"
            "src/gateway/routing/__init__.py"
            "src/gateway/routing/proxy.py"
            "src/gateway/routing/router.py"
            "config/gateway_routes.yaml"
            "Dockerfile.gateway"
            "start_gateway.sh"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              missing=1
            else
              echo "✅ Found: $file"
            fi
          done

          # Check gateway configuration
          if [ -f "config/gateway_routes.yaml" ]; then
            echo "✅ Gateway routes config exists"
            python -c "import yaml; yaml.safe_load(open('config/gateway_routes.yaml'))" || {
              echo "❌ Invalid YAML in gateway_routes.yaml"
              exit 1
            }
          fi

          # Check gateway is in services.yaml
          if grep -q "api_gateway:" config/services.yaml; then
            echo "✅ Gateway registered in services.yaml"
          else
            echo "❌ Gateway not found in services.yaml"
            missing=1
          fi

          # Check gateway in docker-compose
          if grep -q "gateway:" docker-compose.dev.yml; then
            echo "✅ Gateway in docker-compose.dev.yml"
          else
            echo "❌ Gateway not in docker-compose.dev.yml"
            missing=1
          fi

          if [ $missing -eq 1 ]; then
            echo "❌ API Gateway validation failed"
            exit 1
          fi

          echo "✅ API Gateway validation passed"
        continue-on-error: false

      - name: Check for large files
        run: |
          echo "Checking for large files (>1MB)..."
          find src/ -type f -size +1M | while read file; do
            echo "❌ Large file found: $file"
            exit 1
          done
          echo "✅ No large files found"

      - name: Check directory structure
        run: |
          echo "Validating directory structure..."

          # Check for archived code in wrong location
          if [ -d "src/archived" ]; then
            echo "❌ Found src/archived/ - should be _legacy/ or _experiments/ at repo root"
            exit 1
          fi

          # Check for _legacy and _experiments at repo root
          if [ ! -d "_legacy" ]; then
            echo "⚠️  No _legacy/ directory found"
          fi

          if [ ! -d "_experiments" ]; then
            echo "⚠️  No _experiments/ directory found"
          fi

          echo "✅ Directory structure valid"

      - name: Summary
        if: always()
        run: |
          echo "================================================"
          echo "Code Quality Checks Summary"
          echo "================================================"
          echo "✅ Formatting (Black)"
          echo "✅ Import sorting (isort)"
          echo "✅ Linting (flake8)"
          echo "⏩ Type checking (mypy) - informational"
          echo "✅ No TODOs in production"
          echo "✅ No legacy imports"
          echo "⏩ Hardcoded URLs - informational (migration in progress)"
          echo "✅ Port allocation valid"
          echo "✅ API Gateway configuration (ADR-003)"
          echo "✅ No large files"
          echo "✅ Directory structure valid"
          echo "================================================"

  test:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Run tests
        run: |
          poetry run pytest tests/ -v --tb=short || true
        continue-on-error: true  # Non-blocking for now

      - name: Check test results
        run: |
          echo "================================================"
          echo "Test execution completed"
          echo "Note: Tests are informational only"
          echo "================================================"

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          echo "Checking for potential secrets..."

          # Check for common secret patterns
          if grep -rE "(password|secret|key|token).*=.*['\"]" src/ --include="*.py" | grep -v "# "; then
            echo "⚠️  Potential hardcoded secrets found - please review"
          else
            echo "✅ No obvious secrets found"
          fi

      - name: Check .env files
        run: |
          echo "Checking .env files are not in production..."

          if [ -f "src/.env" ] || [ -f "src/.env.local" ]; then
            echo "❌ .env files found in src/ - these should not be committed"
            exit 1
          fi

          echo "✅ No .env files in src/"

  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check ADR completeness
        run: |
          echo "Checking Architecture Decision Records..."

          # Check for required ADRs
          required_adrs=(
            "docs/architecture/ADR-001-service-discovery.md"
            "docs/architecture/ADR-004-port-allocation.md"
            "docs/architecture/ADR-006-resilience-patterns.md"
            "docs/architecture/ADR-007-code-organization.md"
            "docs/architecture/README.md"
          )

          missing=0
          for adr in "${required_adrs[@]}"; do
            if [ ! -f "$adr" ]; then
              echo "❌ Missing: $adr"
              missing=1
            else
              echo "✅ Found: $adr"
            fi
          done

          if [ $missing -eq 1 ]; then
            echo "⚠️  Some ADRs are missing"
          fi

      - name: Check for broken links in ADRs
        run: |
          echo "Checking for broken internal links..."
          # Simple check - can be enhanced with a proper link checker
          echo "✅ Link checking informational only"
