# GitHub Integration Configuration for Test Results
# Automatically creates issues from test failures

[github]
# Repository configuration
repo_owner = maestro-team
repo_name = maestro-v1
api_token_env = GITHUB_TOKEN

# Issue creation settings
create_issues_on_failure = true
update_existing_issues = true
close_issues_on_success = true

# Issue labels and assignment
default_labels = bug,test-failure,automated
assignees = maestro-team
milestone = testing-framework

# Issue templates
failure_title_template = [Test Failure] {test_name} in {service}
failure_body_template =
    ## Test Failure Report

    **Test:** `{test_name}`
    **Service:** {service}
    **File:** {test_file}
    **Line:** {line_number}

    ### Failure Details
    ```
    {failure_message}
    ```

    ### Test Output
    ```
    {test_output}
    ```

    ### Environment
    - **Python Version:** {python_version}
    - **Test Framework:** pytest
    - **Timestamp:** {timestamp}
    - **CI Build:** {ci_build_url}

    ### Related Files
    {related_files}

    ---
    *This issue was automatically created by the MAESTRO testing framework.*

# Issue management
max_issues_per_test = 3
issue_timeout_days = 7
reopen_on_regression = true
