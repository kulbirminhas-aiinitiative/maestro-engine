# Pre-commit hooks for MAESTRO Engine
#
# Part of ADR-007: Code Organization and Cleanup Policy
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# See https://pre-commit.com for more information

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(_legacy|_experiments)/
      - id: end-of-file-fixer
        exclude: ^(_legacy|_experiments)/
      - id: check-yaml
        exclude: ^(_legacy|_experiments)/
      - id: check-json
        exclude: ^(_legacy|_experiments)/
      - id: check-added-large-files
        args: ['--maxkb=1000']  # Prevent files >1MB
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending

  # Python formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: [--line-length=100]
        exclude: ^(_legacy|_experiments)/

  # Python import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        exclude: ^(_legacy|_experiments)/

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --extend-ignore=E203,W503
          - --exclude=_legacy,_experiments
        exclude: ^(_legacy|_experiments)/

  # Custom hooks for MAESTRO-specific checks
  - repo: local
    hooks:
      # Block imports from _legacy or _experiments
      - id: block-legacy-imports
        name: Block imports from _legacy/_experiments
        entry: python scripts/check_legacy_imports.py
        language: system
        files: \.py$
        exclude: ^(_legacy|_experiments|tests)/
        pass_filenames: true

      # Detect hardcoded service URLs
      - id: detect-hardcoded-urls
        name: Detect hardcoded service URLs
        entry: python scripts/detect_hardcoded_urls.py --strict
        language: system
        files: \.py$
        exclude: ^(_legacy|_experiments|tests|docs)/
        pass_filenames: false

      # Validate port allocations
      - id: validate-port-allocation
        name: Validate port allocations
        entry: python scripts/validate_port_allocation.py
        language: system
        files: ^config/services\.yaml$
        pass_filenames: false

      # Check for TODO/FIXME in production code
      - id: check-todos
        name: Check for TODO/FIXME in production
        entry: bash -c 'grep -rn "TODO\|FIXME" src/ && exit 1 || exit 0'
        language: system
        files: \.py$
        exclude: ^(_legacy|_experiments|tests)/
        pass_filenames: false

# Configuration for the hooks
default_language_version:
  python: python3.11
