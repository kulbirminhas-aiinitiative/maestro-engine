# MAESTRO API Gateway Routes Configuration
# Part of ADR-003: API Gateway Pattern
#
# Route format:
#   - path: Route path pattern (supports * wildcard)
#   - backend: Backend service URL (use environment variables)
#   - rate_limit: Rate limit (format: "count/unit")
#   - requires_auth: Whether route requires JWT authentication
#   - cache_ttl: Response cache TTL in seconds (0 = no cache)

routes:
  # Authentication Service (Production Backend on port 3100)
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/v1/auth/*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/auth}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0  # No caching for auth operations

  # Personas Service (Production Backend on port 3100)
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/personas*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/personas}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 60  # Cache for 1 minute (read-heavy endpoint)

  # AI Agents Service (Production Backend on port 3100)
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/v1/ai-agents*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/ai-agents}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0  # No caching for favorites operations

  # Teams Service (Production Backend on port 3100)
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/teams*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/teams}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 60  # Cache for 1 minute (read-heavy endpoint)

  # Missions Service (Production Backend on port 3100)
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/missions*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/missions}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0  # No caching for real-time mission operations

  # Accelerator Mode BFF (Rapid Prototyping)
  - path: /api/v1/accelerator/*
    backend: ${BFF_SERVICE_URL:http://localhost:4001}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0  # No caching for interactive sessions

  # Guardian Mode Engine (Full SDLC)
  - path: /api/v1/guardian/*
    backend: ${MAESTRO_ENGINE_URL:http://localhost:5000}
    rate_limit: 20/minute
    requires_auth: false
    cache_ttl: 0  # No caching for orchestration

  # Template Service (Read-heavy, cache-friendly)
  - path: /api/v1/templates/*
    backend: ${TEMPLATE_SERVICE_URL:http://localhost:9600}
    rate_limit: 200/minute
    requires_auth: false
    cache_ttl: 300  # Cache for 5 minutes

  # RAG Service (Knowledge retrieval)
  - path: /api/v1/rag/*
    backend: ${RAG_SERVICE_URL:http://localhost:9803}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 60  # Cache for 1 minute

  # MCP Service (Model Context Protocol)
  - path: /api/v1/mcp/*
    backend: ${MCP_SERVICE_URL:http://localhost:9800}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  # Quality Fabric (Testing service)
  - path: /api/v1/quality/*
    backend: ${QUALITY_FABRIC_URL:http://localhost:8000}
    rate_limit: 50/minute
    requires_auth: false
    cache_ttl: 0

  # Coordinator Service
  - path: /api/v1/coordinator/*
    backend: ${COORDINATOR_SERVICE_URL:http://localhost:8002}
    rate_limit: 50/minute
    requires_auth: false
    cache_ttl: 0

  # Orchestration Service
  - path: /api/v1/orchestration/*
    backend: ${ORCHESTRATION_SERVICE_URL:http://localhost:8004}
    rate_limit: 50/minute
    requires_auth: false
    cache_ttl: 0

  # Deployment Files (BFF)
  - path: /api/deployment/*
    backend: ${BFF_SERVICE_URL:http://localhost:4001}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  # SDLC Documents and History (BFF)
  - path: /api/sdlc/*
    backend: ${BFF_SERVICE_URL:http://localhost:4001}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  # Workflows API (non-versioned) - Routes /api/workflows/* to Backend (3100)
  # Part of Frontend-Backend DAG Workflow Integration (MD-1649)
  # Frontend dag-workflow-client.ts calls /api/workflows without /v1/ prefix
  # IMPORTANT: Must be BEFORE /api/workflow/* to avoid route conflict
  - path: /api/workflows*
    backend: ${WORKFLOWS_SERVICE_URL:http://host.docker.internal:3100/api/v1/workflows}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0  # No caching for workflow operations

  # Async Workflow Execution (NEW - Workflow API Service)
  # Note: /api/workflow/* (singular) routes to different service than /api/workflows*
  - path: /api/workflow/*
    backend: ${WORKFLOW_API_URL:http://host.docker.internal:5001}
    rate_limit: 50/minute
    requires_auth: false
    cache_ttl: 0

  # Multi-Agent Collaboration (Production Backend)
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/collaboration/*
    backend: ${COLLABORATION_SERVICE_URL:http://host.docker.internal:3100/api/collaboration}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  # Persona Evolution Journey (Foundry) - Production Backend on port 3100
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/foundry/*
    backend: ${FOUNDRY_SERVICE_URL:http://host.docker.internal:3100/api/foundry}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 60  # Cache for 1 minute (read-heavy endpoint with interactions/traits)

  # DAG Workflows (Orchestration) - Production Backend on port 3100
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/v1/dag-workflows*
    backend: ${DAG_WORKFLOWS_SERVICE_URL:http://host.docker.internal:3100/api/v1/dag-workflows}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0  # No caching for workflow operations

  # Workflow Execution Status - Routes /api/executions/* to Backend (3100)
  # Part of Frontend-Backend DAG Workflow Integration (MD-1649)
  # Frontend dag-workflow-client.ts calls /api/executions/:id for execution status
  - path: /api/executions*
    backend: ${EXECUTION_SERVICE_URL:http://host.docker.internal:3100/api/v1/execution-platform}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0  # No caching for execution status (real-time)

  # Additional Backend Routes - Production Backend on port 3100
  # Note: Backend URL includes the path prefix since backend expects full path
  - path: /api/v1/workflows*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/workflows}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/v1/phases*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/phases}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/v1/tasks*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/tasks}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/v1/artifacts*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/artifacts}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/v1/artifact-sections*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/artifact-sections}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/v1/checkpoints*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/checkpoints}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/v1/approvals*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/approvals}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/v1/chat*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/chat}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/v1/files*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/v1/files}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  - path: /api/ai*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100/api/ai}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 60

  # WebSocket routes (for real-time updates)

  # Workflow-specific WebSocket for DAG execution real-time updates
  # Part of Frontend-Backend DAG Workflow Integration (MD-1649)
  # Frontend dag-workflow-client.ts connects to /ws/workflow/:id
  - path: /ws/workflow/*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100}
    rate_limit: 50/minute
    requires_auth: false
    cache_ttl: 0
    websocket: true

  # General WebSocket route for backend (missions, workflows, etc.)
  # Must be after specific routes to allow more specific patterns to match first
  - path: /ws*
    backend: ${AUTH_SERVICE_URL:http://host.docker.internal:3100}
    rate_limit: 50/minute
    requires_auth: false
    cache_ttl: 0
    websocket: true

  - path: /ws/guardian/*
    backend: ${MAESTRO_ENGINE_URL:http://localhost:5000}
    rate_limit: 10/minute
    requires_auth: false
    cache_ttl: 0

  - path: /ws/accelerator/*
    backend: ${BFF_SERVICE_URL:http://localhost:4001}
    rate_limit: 10/minute
    requires_auth: false
    cache_ttl: 0

  # Async Workflow WebSocket (NEW - Workflow API Service)
  - path: /ws/workflow-async/*
    backend: ${WORKFLOW_API_URL:http://host.docker.internal:5001}
    rate_limit: 10/minute
    requires_auth: false
    cache_ttl: 0

  # Multi-Agent Collaboration WebSocket (Collaboration BFF)
  - path: /ws/collaboration/*
    backend: ${COLLABORATION_BFF_URL:http://host.docker.internal:4002}
    rate_limit: 10/minute
    requires_auth: false
    cache_ttl: 0

  # =========================================
  # Deployment Management (MD-1790)
  # =========================================

  # Portainer CE - Container Management GUI (Phase 1 Quick Win)
  - path: /portainer*
    backend: ${PORTAINER_URL:http://localhost:29000}
    rate_limit: 100/minute
    requires_auth: false
    cache_ttl: 0

  # Deployment Management API (Phase 2)
  - path: /api/v1/deployments/*
    backend: ${BFF_SERVICE_URL:http://localhost:4001}
    rate_limit: 50/minute
    requires_auth: false
    cache_ttl: 0

  # Deployment WebSocket for real-time updates
  - path: /ws/deployments/*
    backend: ${BFF_SERVICE_URL:http://localhost:4001}
    rate_limit: 10/minute
    requires_auth: false
    cache_ttl: 0
    websocket: true

# CORS configuration
cors:
  allow_origins:
    - http://localhost:4200  # Frontend dev server
    - http://localhost:4300  # Frontend production dev server
    - http://localhost:3000  # Alternative frontend port
    - http://3.10.213.208:4300  # Public IP access
    - ${FRONTEND_URL:http://localhost:4200}
  allow_origin_regex: "https?://.*:(4200|4300)"  # Allow any host on ports 4200 or 4300
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
    - HEAD
  allow_headers:
    - "*"
  allow_credentials: true

# Rate limiting defaults
rate_limit_defaults:
  default: 60/minute  # Default for routes without explicit limit

# Authentication configuration
auth:
  jwt_secret: ${JWT_SECRET:change-me-in-production}
  permissive_mode: true  # Allow requests without auth (for gradual rollout)
  protected_paths:
    # Add paths that require authentication here
    # - /api/v1/admin/*

# Cache configuration
cache:
  enabled: true
  default_ttl: 300  # 5 minutes (if not specified in route)
  max_size: 1000  # Maximum number of cached entries
