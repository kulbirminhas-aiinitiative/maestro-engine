# MAESTRO Engine - Production Configuration
#
# Production-ready settings with security and resilience focus
#
# IMPORTANT: All sensitive values MUST be set via environment variables

service:
  environment: production
  port: ${PORT:5000}
  host: 0.0.0.0  # Listen on all interfaces

# Production dependencies (via environment variables)
dependencies:
  redis:
    url: ${REDIS_URL}  # Required in production
    password: ${REDIS_PASSWORD}  # Required in production
    max_connections: 50
    socket_timeout: 5

  postgresql:
    url: ${DATABASE_URL}  # Required in production
    pool_size: 20
    max_overflow: 40

  template_service:
    url: ${TEMPLATE_SERVICE_URL}  # Required
    timeout: 10
    retry_attempts: 3

  quality_fabric:
    url: ${QUALITY_FABRIC_URL}  # Required
    timeout: 120
    retry_attempts: 3

# Production orchestration
orchestration:
  execution_mode: ${EXECUTION_MODE:parallel}
  max_parallel_personas: 8  # Higher for production capacity
  timeout_per_persona: 600  # Longer timeout
  enable_mcp: true
  enable_rag: true
  enable_quality_gates: true  # Always enabled in production

# Strict resilience for production
resilience:
  circuit_breakers:
    template_service:
      failure_threshold: 5
      success_threshold: 3  # More successes needed to recover
      timeout: 120  # Longer before retry

    quality_fabric:
      failure_threshold: 3
      success_threshold: 3
      timeout: 180

  retry_policies:
    template_service:
      max_retries: 5  # More retries in production
      initial_delay: 2.0
      backoff_factor: 2.5
      max_delay: 120.0

    quality_fabric:
      max_retries: 3
      initial_delay: 3.0
      backoff_factor: 2.5
      max_delay: 180.0

  timeouts:
    template_fetch: 15
    quality_validation: 300  # 5 minutes
    persona_execution: 600  # 10 minutes
    workflow_total: 1800  # 30 minutes

  bulkheads:
    template_service: 20
    quality_fabric: 5
    persona_execution: 8

# Production logging (structured JSON)
logging:
  level: ${LOG_LEVEL:INFO}
  format: json  # Always JSON in production
  output: stdout  # Captured by container orchestrator
  enable_colors: false

# Strict security for production
security:
  jwt_secret: ${JWT_SECRET}  # Required from environment
  jwt_algorithm: HS256
  jwt_expiration: 3600  # 1 hour
  cors_origins: ${CORS_ORIGINS}  # Specific origins only

# Full monitoring in production
monitoring:
  enable_prometheus: true
  prometheus_port: 9090
  enable_tracing: true
  tracing_endpoint: ${TRACING_ENDPOINT}

# Production features (all enabled)
features:
  enable_accelerator_mode: true
  enable_guardian_mode: true
  enable_template_extraction: true
  enable_audit_logging: true
