[tool.poetry]
name = "maestro-engine"
version = "1.0.0"
description = "MAESTRO Backend Execution Engine - MCP/UTCP orchestration with RAG and template integration"
authors = ["MAESTRO Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Maestro Shared Packages (local paths during migration)
maestro-core-api = {path = "../maestro-shared/packages/core-api", develop = true}
maestro-core-auth = {path = "../maestro-shared/packages/core-auth", develop = true}
maestro-core-config = {path = "../maestro-shared/packages/core-config", develop = true}
maestro-core-logging = {path = "../maestro-shared/packages/core-logging", develop = true}
maestro-core-db = {path = "../maestro-shared/packages/core-db", develop = true}
maestro-core-messaging = {path = "../maestro-shared/packages/core-messaging", develop = true}
maestro-monitoring = {path = "../maestro-shared/packages/monitoring", develop = true}

# Core API framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.31.0"}
pydantic = "^2.9.0"

# Anthropic SDK
anthropic = "^0.34.0"

# HTTP client
httpx = "^0.27.0"

# Async support
aiofiles = "^24.1.0"

# Logging & monitoring
structlog = "^24.4.0"
prometheus-client = "^0.20.0"
psutil = "^6.0.0"

# Configuration
dynaconf = "^3.2.6"
python-dotenv = "^1.0.1"

# Security
cryptography = "^43.0.0"
pyjwt = "^2.9.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

# Database (if needed for RAG)

# Vector DB for RAG (optional - requires Python 3.10+)

# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
opentelemetry-api = "^1.37.0"
opentelemetry-sdk = "^1.37.0"
opentelemetry-instrumentation-fastapi = "^0.58b0"
opentelemetry-instrumentation-logging = "^0.58b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.37.0"
slowapi = "^0.1.9"
redis = "^6.4.0"
celery = "^5.3.0"
pydantic-settings = "^2.11.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
pyyaml = "^6.0.3"
claude-code-sdk = "^0.0.25"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
flake8 = "^7.1.0"
mypy = "^1.11.0"
isort = "^5.13.0"
faker = "^37.8.0"
factory-boy = "^3.3.3"
jsonschema = "^4.25.1"
numpy = "^2.3.3"
testcontainers = "^4.13.1"
pytest-asyncio = "0.24.0"
pre-commit = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Ignore specific test files that reference non-existent modules
# (These were migrated from maestro-v2 but don't match new architecture)
addopts = [
    "-v",
    "--tb=short",
    "--ignore=tests/pending",
    "--ignore=tests/contract/test_openapi_compliance.py",
    "--ignore=tests/e2e/test_api_health.py",
    "--ignore=tests/integration/test_configuration_system.py",
    "--ignore=tests/regression/test_configuration_regression.py",
    "--ignore=tests/test_template_registry_service.py",
    "--ignore=tests/unit/test_dynamic_boundary_manager.py",
    "--ignore=tests/unit/test_phase_complexity_analyzer.py",
    "--ignore=tests/unit/test_template_registry_enhanced.py",
    "--ignore=tests/unit/test_digital_blackboard_system.py",
]
